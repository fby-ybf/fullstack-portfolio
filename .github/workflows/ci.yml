name: CI

on:
  push:
  pull_request:

jobs:
  # Java 全栈：学生成绩查询系统（Spring Boot 3 + JPA + H2）
  score-query-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: score-query-system/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build and test
        run: mvn -B test

  # FastAPI 后端测试（EduRAG / 监控栈）将在对应项目加入后启用
  # edurag-backend / monitor-backend 见各自目录 requirements.txt + pytest
