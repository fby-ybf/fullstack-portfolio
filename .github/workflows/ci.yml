name: CI

on:
  push:
  pull_request:

jobs:
  # Java 全栈：学生成绩查询系统（Spring Boot 3 + JPA + H2）
  score-query-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: score-query-system/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build and test
        run: mvn -B test

  # FastAPI 后端：EduRAG 问答系统
  edurag-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edurag-qa-fullstack/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  # FastAPI 后端：可观测性监控栈（埋点 + 告警 webhook）
  monitor-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor-stack/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
