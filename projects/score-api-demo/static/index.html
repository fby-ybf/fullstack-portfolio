<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>学生成绩查询系统（演示）</title>
<style>
  :root{--bg:#f5f7fb;--card:#fff;--ink:#1f2733;--sub:#6b7688;--accent:#2563eb;--line:#e6eaf2;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--sub);margin:0 0 24px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;}
  h2{font-size:16px;margin:0 0 12px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--sub);font-weight:600;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:#f0f4ff;}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;}
  button{background:var(--accent);color:#fff;border:none;cursor:pointer;}
  .muted{color:var(--sub);}
  .badge{padding:1px 7px;border-radius:4px;font-size:12px;}
  .ok{background:#e8f5e9;color:#2e7d32;}
  .absent{background:#fff3e0;color:#e65100;}
</style>
</head>
<body>
<div class="wrap">
  <h1>学生成绩查询系统 <span class="muted">（演示 Demo）</span></h1>
  <p class="sub">FastAPI + SQLAlchemy + SQLite 全栈示例 · 三表设计 + 索引 + 分页</p>

  <div class="card">
    <h2>学生列表（按班级筛选）</h2>
    <div style="margin-bottom:10px;">
      <input id="clazz" placeholder="输入班级，如 计科2301" style="width:220px;" />
      <button onclick="loadStudents()">查询</button>
    </div>
    <table id="student-table">
      <thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>平均分</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>成绩明细</h2>
    <p id="detail-hint" class="muted">点击上表任意学生查看成绩明细。</p>
    <table id="score-table" style="display:none;">
      <thead><tr><th>课程编号</th><th>课程</th><th>学分</th><th>成绩</th><th>状态</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>班级统计</h2>
    <table id="stat-table">
      <thead><tr><th>班级</th><th>人数</th><th>平均分</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const API = "";
function esc(s){return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
async function loadStudents(){
  const clazz = document.getElementById('clazz').value.trim();
  const url = clazz ? `/api/students?clazz=${encodeURIComponent(clazz)}` : '/api/students';
  const rows = await fetch(url).then(r=>r.json());
  const tb = document.querySelector('#student-table tbody');
  tb.innerHTML = rows.map(s =>
    `<tr class="clickable" onclick="loadScores('${esc(s.student_no)}','${esc(s.name)}')">
       <td>${esc(s.student_no)}</td><td>${esc(s.name)}</td><td>${esc(s.clazz)}</td><td>${s.avg}</td>
     </tr>`).join('');
}
async function loadScores(no, name){
  const body = await fetch(`/api/students/${encodeURIComponent(no)}/scores`).then(r=>r.json());
  document.getElementById('detail-hint').textContent = `学号 ${no} · ${name} 的成绩：`;
  document.getElementById('score-table').style.display = '';
  document.querySelector('#score-table tbody').innerHTML = body.scores.map(sc =>
    `<tr><td>${esc(sc.course_no)}</td><td>${esc(sc.course_name)}</td><td>${sc.credit}</td><td>${sc.value}</td>
     <td><span class="badge ${sc.status==='正常'?'ok':'absent'}">${esc(sc.status)}</span></td></tr>`).join('');
}
async function loadStats(){
  const rows = await fetch('/api/stats/classes').then(r=>r.json());
  document.querySelector('#stat-table tbody').innerHTML = rows.map(c =>
    `<tr><td>${esc(c.clazz)}</td><td>${c.total}</td><td>${c.avg}</td></tr>`).join('');
}
loadStudents(); loadStats();
</script>
</body>
</html>
