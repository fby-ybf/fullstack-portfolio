groups:
  - name: demo-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(request_count_total{status="500"}[1m]))
          / sum(rate(request_count_total[1m])) > 0.25
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "错误率超过 25%"

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(request_duration_seconds_bucket[5m])) by (le, path)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "P95 延迟超过 500ms"

      - alert: InstanceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "服务实例不可用"
