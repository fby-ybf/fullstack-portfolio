# 注意：GitHub Actions 仅识别仓库【根目录】的 .github/workflows。
# 本文件为 monitor-stack 子项目的 CI 定义参考；实际执行在根目录 ci.yml 的 monitor-backend 作业。
name: monitor-backend-ci

on:
  push:
  pull_request:

jobs:
  monitor-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor-stack/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
